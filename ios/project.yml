name: MyPlanningWidget
options:
  bundleIdPrefix: com.clemen5t
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.8.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  MyPlanningWidgetApp:
    type: application
    platform: iOS
    sources:
      - MyPlanningWidgetApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.clemen5t.myplanning.widgetapp
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: MyPlanning
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - target: MyPlanningWidgetExtension

  MyPlanningWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - MyPlanningWidgetExtension
    info:
      path: MyPlanningWidgetExtension/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.clemen5t.myplanning.widgetapp.widget
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "1"

schemes:
  MyPlanningWidgetApp:
    build:
      targets:
        MyPlanningWidgetApp: all
        MyPlanningWidgetExtension: all
    run:
      config: Debug
    archive:
      config: Release
