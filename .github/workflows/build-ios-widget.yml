name: Build iPhone widget

on:
  pull_request:
    paths:
      - "ios/**"
      - ".github/workflows/build-ios-widget.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate
      - name: Build unsigned app and widget
        working-directory: ios
        run: |
          xcodebuild \
            -project MyPlanningWidget.xcodeproj \
            -scheme MyPlanningWidgetApp \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            clean build
      - name: Package unsigned IPA
        working-directory: ios
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/MyPlanningWidgetApp.app Payload/
          /usr/bin/zip -qry MyPlanningWidget-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: MyPlanningWidget-unsigned
          path: ios/MyPlanningWidget-unsigned.ipa
